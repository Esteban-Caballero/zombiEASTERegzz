<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZombiEASTERegzz · IX — Guerrero Venerado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --stone-950:#14110d;
    --stone-900:#1b170f;
    --stone-800:#241f16;
    --stone-700:#332b1e;
    --stone-600:#4a4030;
    --line:#3c3423;
    --parchment:#ede4d2;
    --parchment-dim:#b6a98d;
    --ember:#e2622b;
    --ember-dim:#a8451c;
    --gold:#c9a227;
    --gold-soft:#8a7124;
    --radius:7px;
    --font-display:'Cinzel', serif;
    --font-body:'Public Sans', system-ui, -apple-system, sans-serif;
    --font-mono:'JetBrains Mono', monospace;
    --sidebar-w:250px;
    --index-w:230px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
  }

  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, color-mix(in srgb, var(--ember) 6%, transparent), transparent 45%),
      radial-gradient(ellipse at bottom right, color-mix(in srgb, var(--gold) 5%, transparent), transparent 50%),
      var(--stone-950);
    color:var(--parchment);
    font-family:var(--font-body);
    line-height:1.55;
    min-height:100vh;
    transition:background-color .4s ease;
  }

  a{color:var(--gold);}
  a:hover{color:var(--ember);}

  :focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:3px;}

  .carved{
    font-family:var(--font-display);
    letter-spacing:.03em;
    text-shadow:-1px -1px 0 rgba(0,0,0,.6), 1px 1px 0 rgba(255,241,214,.07);
    color:var(--parchment);
  }

  /* ---------- layout shell ---------- */
  .app{
    display:grid;
    grid-template-columns: var(--sidebar-w) minmax(0,1fr) var(--index-w);
    min-height:100vh;
  }

  .sidebar{
    background:var(--stone-900);
    border-right:1px solid var(--line);
    padding:28px 18px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{
    font-family:var(--font-display);
    font-size:1.05rem;
    color:var(--ember);
    letter-spacing:.06em;
    text-transform:uppercase;
    margin:0 0 22px;
    padding-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .brand small{display:block; font-family:var(--font-body); color:var(--parchment-dim); text-transform:none; letter-spacing:0; font-size:.72rem; margin-top:4px;}

  .game-block{margin-bottom:6px;}
  .game-name{
    display:block; font-weight:600; font-size:.88rem;
    color:var(--parchment); padding:8px 8px; border-radius:var(--radius);
  }
  .game-block.soon .game-name{color:var(--parchment-dim); cursor:not-allowed;}
  .map-list{list-style:none; margin:2px 0 14px; padding:0 0 0 10px; border-left:1px solid var(--line);}
  .map-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:8px 10px; border-radius:var(--radius);
    font-size:.85rem; cursor:pointer; color:var(--parchment-dim);
  }
  .map-item:hover{background:var(--stone-800);}
  .map-item.active{background:var(--stone-800); color:var(--parchment); box-shadow:inset 2px 0 0 var(--ember);}
  .map-item.soon{cursor:not-allowed; opacity:.55;}
  .map-item .sub{display:block; font-size:.72rem; color:var(--parchment-dim); font-weight:400;}
  .pill-soon{
    font-family:var(--font-mono); font-size:.62rem; letter-spacing:.04em;
    color:var(--gold-soft); border:1px solid var(--gold-soft); border-radius:20px;
    padding:1px 6px; white-space:nowrap;
  }

  /* ---------- main column ---------- */
  .main{padding:34px 40px 60px; max-width:760px; margin:0 auto; width:100%;}

  .map-hero{
    border:1px solid var(--line);
    border-radius:10px;
    padding:26px 28px;
    background:linear-gradient(160deg, var(--stone-800), var(--stone-900));
    margin-bottom:22px;
    position:relative; overflow:hidden;
    transition:background .4s ease;
  }
  .map-hero::before{
    content:"";
    position:absolute; inset:0;
    background:radial-gradient(circle at 85% -10%, color-mix(in srgb, var(--ember) 16%, transparent), transparent 55%);
    pointer-events:none;
  }
  .breadcrumb{font-family:var(--font-mono); font-size:.72rem; color:var(--parchment-dim); margin:0 0 10px; letter-spacing:.03em;}
  .map-hero h1{font-size:2rem; margin:0 0 4px;}
  .map-hero .subtitle{font-family:var(--font-display); color:var(--ember); font-size:1.05rem; margin:0 0 14px; letter-spacing:.03em;}
  .map-hero p{margin:0 0 16px; color:var(--parchment-dim); font-size:.92rem; max-width:56ch;}
  .god-legend{display:flex; flex-wrap:wrap; gap:8px;}
  .god-chip{
    display:inline-flex; align-items:center; gap:6px;
    font-family:var(--font-mono); font-size:.72rem; padding:4px 10px;
    border-radius:20px; border:1px solid var(--line); color:var(--parchment-dim);
  }
  .god-dot{width:8px; height:8px; border-radius:50%; display:inline-block;}

  .tabs{display:flex; gap:6px; margin-bottom:8px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
  .tab-btn{
    font-family:var(--font-display); letter-spacing:.03em;
    background:none; border:none; color:var(--parchment-dim);
    padding:10px 16px; font-size:.85rem; cursor:pointer; position:relative; top:1px;
  }
  .tab-btn.active{color:var(--parchment); border-bottom:2px solid var(--ember);}
  .tab-btn:hover{color:var(--parchment);}

  .hint{font-size:.78rem; color:var(--parchment-dim); margin:14px 2px 22px; font-style:italic;}

  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  .cards{display:flex; flex-direction:column; gap:16px;}

  .step-card{
    background:var(--stone-900);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 20px 20px;
    scroll-margin-top:20px;
    transition:background .4s ease, border-color .4s ease;
  }
  .step-head{display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;}
  .step-num{
    font-family:var(--font-mono); font-size:.75rem; color:var(--stone-950);
    background:var(--ember); border-radius:4px; padding:2px 7px; font-weight:600;
  }
  .step-head h3{margin:0; font-family:var(--font-display); font-size:1.02rem; font-weight:600; letter-spacing:.02em; color:var(--parchment);}
  .tag{font-family:var(--font-mono); font-size:.66rem; letter-spacing:.03em; padding:2px 8px; border-radius:20px; border:1px solid transparent; margin-left:auto;}

  .step-body{font-size:.9rem; color:var(--parchment);}
  .step-body p{margin:0 0 10px;}
  .step-body ul, .step-body ol{margin:0 0 10px; padding-left:20px;}
  .step-body li{margin-bottom:5px;}
  .step-body .note{color:var(--parchment-dim); font-size:.82rem; font-style:italic;}
  .step-body .guide-section, .step-body > h2{
    margin:22px 0 12px; padding:7px 10px;
    border-left:3px solid var(--ember); background:var(--stone-800);
    font-family:var(--font-display); font-size:.96rem; font-weight:600;
    letter-spacing:.025em; color:var(--parchment);
  }
  .step-body .guide-subsection, .step-body > h3{
    margin:16px 0 8px; padding-bottom:4px; border-bottom:1px solid var(--line);
    font-family:var(--font-display); font-size:.88rem; font-weight:600;
    color:var(--parchment);
  }
  .step-body .guide-box, .step-body .meta-box{
    margin:10px 0 14px; padding:12px 14px; border:1px solid var(--line);
    border-left:3px solid var(--gold-soft); border-radius:var(--radius);
    background:var(--stone-800);
  }
  .step-body .guide-cheat, .step-body .cheat-sheet{
    margin:10px 0 14px; padding:12px 14px; border:1px solid var(--line);
    border-radius:var(--radius); background:var(--stone-950);
    color:var(--parchment-dim); font-family:var(--font-mono); font-size:.78rem;
  }
  .step-body .guide-image, .step-body .img-frame{
    margin:12px 0 !important; padding:8px; border:1px dashed var(--stone-600);
    border-radius:var(--radius); background:var(--stone-800); text-align:center;
  }
  .step-body .guide-image img, .step-body .img-frame img{display:block; width:auto; max-width:100% !important; max-height:360px; margin:auto; border-radius:4px;}
  .step-body .guide-table, .step-body > table, .step-body > div > table{width:100%; margin:12px 0; border-collapse:collapse; font-size:.82rem;}
  .step-body .guide-table th, .step-body .guide-table td, .step-body > table th, .step-body > table td, .step-body > div > table th, .step-body > div > table td{padding:8px !important; border:1px solid var(--line) !important; text-align:left;}
  .step-body .guide-table th, .step-body > table th, .step-body > div > table th{background:var(--stone-800) !important; color:var(--gold) !important;}
  .step-body .guide-table td:last-child, .step-body > table td:last-child, .step-body > div > table td:last-child{text-align:center;}
  .step-body .guide-split{display:grid; grid-template-columns:minmax(0,1fr) minmax(180px,240px); gap:14px; align-items:start; margin:12px 0;}
  .step-body .guide-split .guide-table, .step-body .guide-split .guide-image,
  .step-body .guide-split > table, .step-body .guide-split > .img-frame{margin:0 !important;}
  .link-btn{background:none; border:none; color:var(--gold); text-decoration:underline; font:inherit; cursor:pointer; padding:0;}

  .ts-link{
    display:inline-flex; align-items:center; gap:5px;
    font-family:var(--font-mono); font-size:.74rem; color:var(--gold);
    text-decoration:none; border:1px solid var(--gold-soft); border-radius:20px;
    padding:4px 10px; margin-top:4px;
  }
  .ts-link:hover{background:var(--stone-800);}

  .clip{
    margin:10px 0 8px; border-radius:6px; overflow:hidden; border:1px solid var(--line);
    aspect-ratio:16/9; background:#000;
  }
  .clip iframe{width:100%; height:100%; border:0; display:block;}

  .shot{margin:12px 0 4px; border:1px dashed var(--stone-600); border-radius:6px; overflow:hidden; background:var(--stone-800);}
  .shot img{width:100%; display:block;}
  .shot figcaption{font-size:.72rem; color:var(--parchment-dim); padding:6px 10px;}


  .sources{margin-top:34px; border-top:1px solid var(--line); padding-top:18px;}
  .sources h3{font-family:var(--font-display); font-size:.95rem; margin:0 0 8px; color:var(--parchment);}
  .sources p{font-size:.82rem; color:var(--parchment-dim); margin:0 0 8px;}
  .sources .fine{font-size:.74rem; opacity:.8;}

  /* ---------- quick index (right rail) ---------- */
  .quickindex{
    border-left:1px solid var(--line);
    background:var(--stone-900);
    padding:26px 16px;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .quickindex h2{font-family:var(--font-mono); font-size:.68rem; letter-spacing:.08em; text-transform:uppercase; color:var(--parchment-dim); margin:0 0 12px;}
  .qi-list{list-style:none; margin:0; padding:0;}
  .qi-list li{margin-bottom:2px;}
  .qi-list a{
    display:block; font-size:.79rem; color:var(--parchment-dim); text-decoration:none;
    padding:6px 10px; border-radius:5px; border-left:2px solid transparent;
  }
  .qi-list a:hover{color:var(--parchment); background:var(--stone-800);}
  .qi-list li.active a{color:var(--parchment); border-left-color:var(--ember); background:var(--stone-800);}

  /* ---------- mobile toggles (hidden on desktop) ---------- */
  .icon-btn{
    display:none; position:fixed; z-index:40; font-family:var(--font-mono);
    background:var(--stone-800); color:var(--parchment); border:1px solid var(--line);
    border-radius:20px; padding:9px 14px; font-size:.78rem; cursor:pointer;
  }
  .nav-toggle{top:14px; left:14px;}
  .index-toggle{bottom:18px; right:18px;}
  .scrim{display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:30;}
  .scrim.show{display:block;}

  /* ---------- responsive ---------- */
  @media (max-width:1180px){
    .app{grid-template-columns: var(--sidebar-w) minmax(0,1fr);}
    .quickindex{
      position:fixed; right:0; top:0; height:100vh; width:min(260px,80vw);
      transform:translateX(100%); transition:transform .25s ease; z-index:35;
    }
    .quickindex.open{transform:translateX(0);}
    .index-toggle{display:block;}
  }
  @media (max-width:900px){
    .step-body .guide-split{grid-template-columns:1fr;}
    .app{grid-template-columns: 1fr;}
    .sidebar{
      position:fixed; left:0; top:0; height:100vh; width:min(260px,80vw);
      transform:translateX(-100%); transition:transform .25s ease; z-index:35;
    }
    .sidebar.open{transform:translateX(0);}
    .nav-toggle{display:block;}
    .main{padding:70px 18px 60px;}
  }
</style>
</head>
<body>

<button id="navToggle" class="icon-btn nav-toggle" aria-label="Abrir menú de juegos">☰ Juegos</button>
<button id="indexToggle" class="icon-btn index-toggle" aria-label="Abrir índice rápido">≡ Índice</button>
<div id="scrim" class="scrim"></div>

<div class="app">

  <aside id="sidebar" class="sidebar">
    <p class="brand carved">ZombiEASTERegzz<small>wiki personal · sin publicación pública</small></p>
    <nav id="gameTree"></nav>
  </aside>

  <main class="main">
    <header class="map-hero">
      <p class="breadcrumb" id="breadcrumb"></p>
      <h1 class="carved" id="mapTitle"></h1>
      <p class="subtitle" id="mapSubtitle"></p>
      <p id="mapDesc"></p>
      <div class="god-legend" id="godLegend"></div>
    </header>

    <nav class="tabs" id="tabBar"></nav>
    <p class="hint">💡 Usa el índice de la derecha (o el botón «Índice» en móvil) para saltar directo a cualquier paso.</p>

    <div id="tabPanels"></div>

    <footer class="sources" id="sourcesFooter"></footer>
  </main>

  <aside id="quickIndex" class="quickindex">
    <h2 id="qiTitle">Índice rápido</h2>
    <ol class="qi-list" id="qiList"></ol>
  </aside>

</div>

<script>
const DEFAULT_YT_ID = 'y3VWQ-8pYMU';

function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return m + ':' + String(s).padStart(2,'0');
}

// ---------------- DATA ----------------
// Cada mapa lleva su propio "theme" (paleta) y "tags" (etiquetas de color propias
// del mapa, ej. dioses en IX, cubiertas del barco en Blood of the Dead, etc).
// Para añadir un mapa nuevo: copia un bloque de "maps", ponle status:'active',
// dale su theme/tags/tabs, y listo — el resto de la web se adapta solo.
const GAMES = [
  {
    id:'bo4-zombies', name:'Black Ops 4: Zombies', status:'active',
    maps:[
      {
        id:'ix', name:'IX', sub:'Guerrero Venerado', status:'active',
        title:'IX', subtitle:'Guerrero Venerado',
        desc:'Guía de consulta rápida para completar el Easter Egg principal, montar el escudo Toro Osado y conseguir la Muerte de Orión sin tener que pausar el vídeo en cada paso.',
        theme:{
          accent:'#e2622b', accentDim:'#a8451c', gold:'#c9a227', goldSoft:'#8a7124',
          stone950:'#14110d', stone900:'#1b170f', stone800:'#241f16', stone700:'#332b1e', stone600:'#4a4030', line:'#3c3423'
        },
        tags:{
          zeus:{label:'Zeus', color:'#6fa3d8'},
          odin:{label:'Odín', color:'#93a6ac'},
          ra:{label:'Ra', color:'#e0a930'},
          danu:{label:'Danu', color:'#6f9a5f'}
        },
        tabs:[
          {
            id:'construibles', label:'Construibles',
            items:[
              {id:'escudo-resumen', title:'El Escudo «Toro Osado»', html:`
                <p>El <strong>Toro Osado</strong> es el escudo especial del mapa. Bloquea golpes cuerpo a cuerpo, sirve como arma de melé pesada y, manteniendo pulsado el gatillo, dispara bolas de fuego a distancia (te mueves más lento mientras apuntas).</p>
                <p>Si se queda sin munición o se daña, puedes repararlo en cualquier mesa de crafteo por 250 puntos. Merece la pena montarlo pronto, aprovechando las rondas en las que ya te mueves entre las cuatro torres para activar el Pack-a-Punch.</p>`},
              {id:'pieza-zeus', title:'Pieza · Hoja de Zeus', tag:'zeus', html:`
                <p>Aparece en la <strong>Torre de Zeus</strong>, en una de estas tres zonas (solo estará en una por partida):</p>
                <ul>
                  <li>Sala del altar de Zeus, a los pies de la estatua principal.</li>
                  <li>Piso superior de la torre, sobre una repisa o en la mano extendida de una estatua.</li>
                  <li>Sótano / baños de Zeus, apoyada contra el mármol de una esquina.</li>
                </ul>`},
              {id:'pieza-odin', title:'Pieza · Mango de Odín', tag:'odin', html:`
                <p>Aparece en la <strong>Torre de Odín</strong>, en una de estas tres zonas:</p>
                <ul>
                  <li>Sala del altar de Odín, junto al muro donde cuelgan los escudos decorativos.</li>
                  <li>Piso superior, junto a un barril de madera.</li>
                  <li>Sótano, en el suelo junto a una columna de piedra cerca del caldero.</li>
                </ul>`},
              {id:'pieza-ra', title:'Pieza · Espada de Ra', tag:'ra', html:`
                <p>Aparece en la <strong>Torre de Ra</strong>, en una de estas tres zonas:</p>
                <ul>
                  <li>Sala del altar de Ra, en una esquina al subir las escaleras principales.</li>
                  <li>Justo enfrente de esa ubicación, pegada a la pared del fondo.</li>
                  <li>Zona subterránea de la torre, cerca de una esquina iluminada.</li>
                </ul>`},
              {id:'escudo-construccion', title:'Ensamblaje en El Foso', html:`
                <p>Con las tres piezas en tu poder, baja a <strong>El Foso</strong> (The Pit). En la sección subterránea que conecta las torres, cerca de la Caja Misteriosa, hay una mesa de crafteo. Interactúa con ella (coste aproximado: 1.500 puntos) para ensamblar el Toro Osado.</p>
                <figure class="shot" data-slot="escudo-crafteo">
                  <img src="img/escudo-crafteo.jpg" alt="Fabricación del escudo en la mesa de crafteo de El Foso" loading="lazy" onerror="this.closest('.shot').style.display='none'">
                  <figcaption>Mesa de crafteo en El Foso</figcaption>
                </figure>`}
            ]
          },
          {
            id:'easterEgg', label:'Easter Egg',
            items:[
              {id:'ee-intro', title:'Antes de empezar', html:`
                <p>Necesitas el escudo <strong>Toro Osado</strong> (pestaña <button class="link-btn" onclick="switchTab('construibles')">Construibles</button>) y la <strong>Muerte de Orión</strong>. Esta última puede tocarte por azar en la Caja Misteriosa, o conseguirse gratis con estos cuatro pasos previos:</p>`},
              {id:'arma-pap', title:'Prerrequisito · Pack-a-Punch', html:`
                <p>Toca el gong del altar en cada una de las cuatro torres (Zeus, Odín, Ra y Danu). Cada gong invoca a un campeón: elimínalo para que suelte una cabeza sacrificial. Cuando tengas las cuatro, baja al Templo subterráneo y colócalas en las picas alrededor del altar central para activar el Pack-a-Punch.</p>`},
              {id:'arma-cabeza', title:'Prerrequisito · Cabeza de Estatua', html:`
                <p>De espaldas a la máquina de Pack-a-Punch, busca una reja de hierro a medio subir con un brasero encendido al fondo y dispárale para tirarlo. Sube al puente exterior que une la Torre de Danu con la de Ra y mira hacia abajo: una flecha de fuego señala en qué torre ha aparecido la cabeza de estatua (la ubicación cambia cada partida). Recógela.</p>`},
              {id:'arma-jarron', title:'Prerrequisito · Trampa de Ácido y Jarrón Dorado', html:`
                <p>Consigue el engranaje y la cadena repartidos por el Templo para montar la trampa de ácido, y completa los tres primeros desafíos de los estandartes en la arena principal (se activan cortando las cuerdas que los sujetan) para que te entreguen el Jarrón Dorado.</p>
                <p>Lleva la cabeza de piedra a cualquier entrada de trampa de ácido (por ejemplo, en la Torre de Ra), colócala en la rejilla inferior y activa la trampa. El ácido derretirá la piedra y dejará a la vista la Llave del Escorpión; recógela.</p>`},
              {id:'arma-veneno', title:'Prerrequisito · Veneno y Caja Envenenada', html:`
                <p>Baja al Arboretum, en la planta inferior de la Torre de Danu. Busca el segundo árbol desde las escaleras: tiene un pequeño orificio. Golpéalo cuerpo a cuerpo para clavar la Llave del Escorpión, y coloca el Jarrón Dorado justo debajo para recoger la savia venenosa.</p>
                <p>Espera una ronda completa y recupera el jarrón ya lleno. Por último, ve a la Caja Misteriosa y elige la opción <strong>«Envenenar Caja»</strong> en su lateral izquierdo: tu siguiente tirada te dará garantizada la Muerte de Orión.</p>
                <figure class="shot" data-slot="jarron-arboretum">
                  <img src="img/jarron-arboretum.jpg" alt="Jarrón Dorado recogiendo savia venenosa en el Arboretum de Danu" loading="lazy" onerror="this.closest('.shot').style.display='none'">
                  <figcaption>Jarrón Dorado bajo la savia ácida, Arboretum de Danu</figcaption>
                </figure>`},
              {id:'paso1', num:'01', title:'Polvo de Calavera', time:48, embed:true, html:`
                <p>Busca entre los cientos de cráneos de la sala del Pack-a-Punch uno que tenga un jeroglífico azul en la frente. Dispárale con la Muerte de Orión para desprenderlo y llévalo a la máquina trituradora de la Cripta Inundada. Dispárale tres tiros cargados (dos si el arma está mejorada) para molerlo y recoger el polvo resultante.</p>`},
              {id:'paso2', num:'02', title:'Leño y Tributo', time:153, embed:true, html:`
                <ol>
                  <li>Provoca a un gladiador para que lance su hacha contra los tablones de la arena; al impactar se desprende un leño especial. Recógelo.</li>
                  <li>Colócalo en la hoguera de la Torre de Odín y espera tres rondas completas hasta que quede al rojo vivo.</li>
                  <li>Baja al mínimo la afinidad del público lanzando granadas a las gradas, hasta que te arrojen estiércol.</li>
                  <li>Lleva el leño, el estiércol y el polvo de calavera a los baños de Zeus y mézclalos. Espera 2-3 rondas hasta que la mezcla desprenda humo verde.</li>
                  <li>Traslada la mezcla a las raíces de la Torre de Danu y déjala reposar una ronda más.</li>
                </ol>`},
              {id:'paso3', num:'03', title:'La Dimensión de Danu', time:284, embed:true, tag:'danu', html:`
                <p>Compra la mejora Bomba Incendiaria y consigue una muerte con fuego justo sobre la mezcla depositada en Danu. Se abrirá una grieta celeste bajo tus pies: entra en ella para viajar a una dimensión alternativa.</p>
                <p>Ya dentro, revienta las pústulas que cuelgan de los árboles en cada uno de los tres pisos de la torre. Al completar el último piso, volverás automáticamente al mapa principal.</p>`},
              {id:'paso4', num:'04', title:'El Templo de Ra', time:388, embed:true, tag:'ra', html:`
                <p>Con el fuego del escudo, dispara a los cuatro medallones rúnicos escondidos en los muros del mapa (sala del Pack-a-Punch, Torre de Danu, el puente y la cripta). Elimina después a los gladiadores pesados que custodian la Torre de Ra para encender el Obelisco.</p>
                <p>Activa el tótem junto al obelisco: te mostrará una secuencia de cuatro zombis elementales. Elimínalos <strong>exactamente en ese orden</strong>, sin herir por accidente a ningún otro zombi elemental, y repite el desafío con una secuencia distinta una segunda vez para superarlo del todo.</p>`},
              {id:'paso5', num:'05', title:'Los Pararrayos de Zeus', time:659, tag:'zeus', embed:true, html:`
                <p>Dispara desde las ventanas a los cuatro tornillos periféricos de la Torre de Zeus para levantarlos. Compra la mejora elemental <strong>Vatio Mortal</strong> y activa el evento desde el pedestal central de la arena.</p>
                <p>Electrocuta a los zombis mientras están dentro de los círculos marcados en el suelo para cargar los generadores, y entra en la zona de confinamiento cuando se abra para limpiar la ronda.</p>`},
              {id:'paso6', num:'06', title:'Símbolos de Odín e Inundación', time:792, embed:true, tag:'odin', html:`
                <p>Localiza los tres símbolos circulares en los muros exteriores del mapa (Cripta, El Foso y Danu) y dispárales con la Muerte de Orión.</p>
                <p>Reúne después a todo el equipo sobre la rejilla de la sala del escudo para activar la inundación de supervivencia. Aguanta tres oleadas intensas sin que el agua os arrastre y, al terminar, recoge la Llave Dorada del suelo: con ella se abre la puerta de la arena final.</p>`},
              {id:'paso7', num:'07', title:'Enfrentamiento Final', html:`
                <p>Cruza el portal que se abre en el centro de la arena para acceder al combate final. Aparecerán oleadas de enemigos normales mientras debes concentrarte en el primer elefante-jefe: dispara primero a su armadura lateral para romperla y después a su frente, que queda expuesta y brillante, hasta derribarlo.</p>
                <p>Al caer, aparecerá un segundo elefante; repite la misma estrategia. Cuando ambos caigan, se disparará la escena final y el Easter Egg quedará completado.</p>
                <p class="note">Este último tramo no aparece con marca de tiempo en el vídeo de referencia; el resumen está contrastado con varias guías comunitarias adicionales (ver Fuentes al final de la página).</p>`}
            ]
          },
          {
            id:'secretos', label:'Secretos',
            items:[
              {id:'secretos-placeholder', title:'Próximamente', html:`
                <p>Todavía no hay contenido recopilado sobre trofeos, desafíos secundarios o canciones ocultas de este mapa. En cuanto me pases una fuente sobre alguno de estos temas, lo añadimos aquí con el mismo formato que el resto de la guía.</p>`}
            ]
          }
        ],
        sources:{
          html:`<p>Guía basada principalmente en el vídeo <a href="https://www.youtube.com/watch?v=y3VWQ-8pYMU" target="_blank" rel="noopener">«Guía completa Easter Egg IX — Guerrero Venerado, todos los pasos»</a>, del canal PokeR988TV. Los apartados del escudo, el arma especial y el enfrentamiento final se han contrastado además con guías comunitarias públicas sobre el mapa IX para completar detalles que el vídeo no cubre con marca de tiempo.</p>
                <p class="fine">Proyecto personal, sin ánimo de lucro ni redistribución pública. Call of Duty: Black Ops 4 y sus contenidos pertenecen a Activision / Treyarch; este sitio solo describe, con palabras propias, cómo completar sus retos.</p>`
        }
      },

            items:[
              {id:'escudo-resumen', title:'El Escudo Espectral', html:`
                <p>El <strong>Escudo Espectral</strong> te permite ver objetos y enemigos ocultos con su visión (mantén pulsado el botón de apuntar) y disparar una ráfaga espiritual para interactuar con el entorno o dañar enemigos.</p>
                <p>Necesita tres piezas repartidas por el mapa; en cada partida solo hay una ubicación posible de cada una:</p>`},
              {id:'pieza-llave', title:'Pieza · Llave del Alcaide', html:`
                <p>Se obtiene derrotando al jefe <strong>Brutus</strong> cuando aparece, ya sea al encender los interruptores de la luz o por azar en rondas tempranas.</p>`},
              {id:'pieza-esencia', title:'Pieza · Esencia Azul', html:`
                <p>Está dentro de una de las cajas de fusibles eléctricas repartidas por la prisión. La reconocerás por su brillo azulado; la caja concreta cambia cada partida.</p>`},
              {id:'pieza-placa', tag:'tuneles', title:'Pieza · Placa de Metal', html:`
                <p>Se encuentra en los <strong>Túneles de la Ciudadela</strong>, en el suelo junto a los muros de piedra o cerca de las rejas.</p>`},
              {id:'escudo-construccion', title:'Ensamblaje', html:`
                <p>Con las tres piezas en tu poder, ve a la mesa de crafteo de los muelles inferiores o de la tercera planta de celdas para montar el Escudo Espectral.</p>
                <figure class="shot" data-slot="escudo-botd">
                  <img src="img/botd-escudo.jpg" alt="Mesa de crafteo del Escudo Espectral" loading="lazy" onerror="this.closest('.shot').style.display='none'">
                  <figcaption>Mesa de crafteo del Escudo Espectral</figcaption>
                </figure>`}
            ]
          },
          {
            id:'easterEgg', label:'Easter Egg',
            items:[
              {id:'loadout', title:'Equipo recomendado', html:`
                <p>Arma especial de clase: <strong>Espada Path of Sorrows</strong> (Richtofen/Takeo) — su habilidad de nivel superior da invisibilidad temporal y velocidad extra, perfecta para huir de encerronas en los pasillos estrechos de la prisión. Granada recomendada: <strong>Fuego de Mono</strong> (más abajo tienes cómo conseguirlo gratis).</p>
                <p>En bebidas, procura llevar <strong>Banda de la Victoria</strong> (evita que morir mientras usas el escudo te mate de verdad), <strong>Frío de Invierno</strong> (te da margen al recolectar almas) y <strong>Deseo de Morir</strong> (red de seguridad contra Brutus); si hay hueco, añade <strong>Stamin-Up</strong> para las carreras largas del mapa.</p>`},
              {id:'ee-intro', title:'Antes de empezar', html:`
                <p>Necesitas el <strong>Escudo Espectral</strong> (pestaña <button class="link-btn" onclick="switchTab('construibles')">Construibles</button>), el Tomahawk, los Monos y la Cuchara de Plata, además del Blundergat con alguna de sus mejoras. Aquí tienes cómo conseguir cada uno gratis:</p>`},
              {id:'arma-tomahawk', title:'Prerrequisito · Tomahawk (Hell\u2019s Retriever)', videoId:'ReOzj107TYE', embed:true, html:`
                <p>Alimenta a los tres Perros de Fuego (Cerberos) matando zombis junto a sus emblemas en la pared:</p>
                <ul>
                  <li>Perro 1: bloque de celdas (New Industries / segunda planta).</li>
                  <li>Perro 2: Túneles de la Ciudadela.</li>
                  <li>Perro 3: Casa del Alcaide, fuera de la oficina.</li>
                </ul>
                <p>Cuando los tres se retiren a la pared, coge el viaje rápido subterráneo entre la Casa del Alcaide y las Duchas: a mitad de trayecto verás el Tomahawk flotando. Interactúa para recogerlo.</p>
                <figure class="shot" data-slot="botd-perro">
                  <img src="img/botd-perro.jpg" alt="Emblema del perro de fuego devorando un zombi" loading="lazy" onerror="this.closest('.shot').style.display='none'">
                  <figcaption>Emblema del perro de fuego en el muro de los túneles</figcaption>
                </figure>`},
              {id:'arma-monos', title:'Prerrequisito · Monos Gratis', html:`
                <p>Ve al Laboratorio de Richtofen (zona inicial) y espera a que aparezca una ronda de <strong>Brutus</strong>. Deja que golpee y destruya por completo la máquina de teletransporte o el panel eléctrico central del laboratorio. Al matarlo justo después de ese golpe, soltará el Fuego de Mono garantizado.</p>`},
              {id:'arma-cuchara', title:'Prerrequisito · Cuchara de Plata', html:`
                <p>Con el Escudo Espectral equipado, ve a la Oficina del Alcaide y usa la visión espectral sobre los pilares: aparecerá un código de tres cifras.</p>
                <ol>
                  <li>Introduce ese código en el teclado numérico de la parte baja de la Ciudadela; el ascensor central bajará una jaula grande.</li>
                  <li>Ve a los muelles e interactúa con el voltímetro usando una descarga espiritual del escudo para activar la grúa, que sacará una red del agua helada.</li>
                  <li>Lánzale el Tomahawk a la red para cortarla: la Cuchara de Plata caerá sobre las cajas metálicas del muelle.</li>
                </ol>
                <figure class="shot" data-slot="botd-cuchara">
                  <img src="img/botd-cuchara.jpg" alt="Cuchara de Plata sobre las cajas metálicas del muelle" loading="lazy" onerror="this.closest('.shot').style.display='none'">
                  <figcaption>Cuchara de Plata cayendo sobre el muelle</figcaption>
                </figure>`},
              {id:'arma-blundergat', title:'Prerrequisito · Blundergat Gratis', videoId:'ReOzj107TYE', html:`
                <p>Con el Escudo Espectral, usa la visión espectral y el Tomahawk para recoger 5 cráneos invisibles repartidos por el mapa:</p>
                <ul>
                  <li>Celdas: en la barandilla de la escalera que sube desde las duchas.</li>
                  <li>Oficina: ventana rota del Alcaide, sobre el poste de luz exterior.</li>
                  <li>Muelles: flotando sobre un noray de amarre de barcos.</li>
                  <li>Tejado (Pack-a-Punch): esquina derecha, sobre un cajón de madera roto.</li>
                  <li>Pasarela exterior: sobre los cables/aisladores de alta tensión.</li>
                </ul>
                <p>Tras recoger los cinco, el Blundergat aparecerá flotando sobre la mesa del despacho del Alcaide.</p>`},
              {id:'arma-magmagat', title:'Mejora · Magmagat', videoId:'ujmNtSsB2XE', embed:true, html:`
                <p>Coloca el Blundergat en la chimenea encendida de la Casa del Alcaide y mata zombis en esa sala: sus almas llenan tres calaveras sobre la repisa. Cuando estén llenas, recoge el arma ya imbuida.</p>
                <p>Empieza entonces una <strong>carrera contrarreloj</strong>: corre hasta las Industrias del Bloque Oeste tocando por el camino los barriles de fuego azul (Oficina, Recreo, Pasillos...) para no perder la llama. Al llegar, colócala en la prensa industrial y espera unos segundos para obtener el <strong>Magmagat</strong>.</p>
                <figure class="shot" data-slot="botd-barril">
                  <img src="img/botd-barril.jpg" alt="Barril de fuego azul en el patio de recreo" loading="lazy" onerror="this.closest('.shot').style.display='none'">
                  <figcaption>Barril azul para recargar el tiempo del Magmagat</figcaption>
                </figure>`},
              {id:'arma-acidgat', title:'Mejora · Acidgat', html:`
                <p>Reúne las 3 piezas del kit de ácido: el maletín (Enfermería), el motor (pasillos de celdas) y el jarrón químico (túneles inferiores). Llévalas a cualquier mesa de crafteo, ensambla el kit e introduce el Blundergat para convertirlo en el <strong>Acidgat</strong>.</p>`},
              {id:'fase1-paso1', num:'01', title:'El Laboratorio Secreto', videoId:'L3yu30XU6Is', time:597, embed:true, html:`
                <p>Con la Cuchara de Plata y el escudo equipados, ve a la Oficina del Alcaide y golpea con la cuchara la pared oculta del fondo para revelar el laboratorio secreto.</p>`},
              {id:'fase1-paso2', num:'02', title:'El Libro de Crónicas', videoId:'L3yu30XU6Is', time:660, embed:true, html:`
                <p>Ve a las duchas y busca el portal espectral; dale una ráfaga de escudo para que aparezca el Libro de Crónicas de Richtofen. Recógelo y llévalo a la mesa del despacho del Alcaide, colocándolo sobre el pedestal.</p>`},
              {id:'fase2-intro', title:'Los 5 Fantasmas Espectrales', html:`
                <p>Al interactuar con el libro, los ojos del mapa parpadearán: los fantasmas se han liberado. Resuelve cada desafío recargando el escudo con almas constantemente:</p>`},
              {id:'fantasma-industrias', num:'03', tag:'industrias', title:'Industrias Oeste · El Fantasma Mecánico', videoId:'L3yu30XU6Is', time:780, embed:true, html:`
                <p>Usa el escudo para ver al fantasma operando las palancas de la maquinaria industrial. Dispárale una ráfaga espiritual para iniciar su ruta: escóltalo y defiéndelo del ataque de Brutus y los zombis mientras absorbe la energía de tres paneles eléctricos de la sala.</p>`},
              {id:'fantasma-muelles', num:'04', tag:'muelles', title:'Los Muelles · El Fantasma de la Grúa', videoId:'L3yu30XU6Is', time:930, embed:true, html:`
                <p>Introduce el código espiritual de 3 dígitos parpadeantes en el panel metálico de la grúa. El fantasma aparecerá colgado con una soga sobre el agua helada; dale una ráfaga espiritual para infundirle fuerza. La grúa sacará del fondo del mar un contenedor con la pieza ritual.</p>`},
              {id:'fantasma-tuneles', num:'05', tag:'tuneles', title:'Túneles de la Ciudadela · Escolta del Prisionero', videoId:'L3yu30XU6Is', time:1080, embed:true, html:`
                <p>Encuentra al espíritu del reo encadenado en la base de la espiral. Dispárale ráfagas espirituales continuamente para darle energía y guiarlo a través de los túneles angostos hasta las Duchas, limpiando los zombis que le corten el paso.</p>`},
              {id:'fantasma-pasarela', num:'06', tag:'pasarela', title:'La Pasarela · Caza del Fantasma Veloz', videoId:'L3yu30XU6Is', time:1230, embed:true, html:`
                <p>Un fantasma invisible correrá a toda velocidad por la pasarela exterior del inicio del mapa. Equipa Stamin-Up, persíguelo apuntando con el escudo y dispárale ráfagas espirituales consecutivas para frenarlo y absorberlo antes de que llegue al portón final de la prisión.</p>`},
              {id:'fantasma-enfermeria', num:'07', tag:'enfermeria', title:'Enfermería y Cafetería · Sincronización de Palancas', videoId:'L3yu30XU6Is', time:1380, embed:true, html:`
                <p>Tres interruptores espectrales se activan en las paredes de la Enfermería y la Cafetería. Todo el equipo debe coordinarse con la visión espectral para activar las tres palancas de forma estrictamente simultánea usando las descargas de sus escudos.</p>`},
              {id:'fase3-sacrificio', num:'08', title:'El Sacrificio', videoId:'L3yu30XU6Is', time:1530, embed:true, html:`
                <p>Tras completar los cinco fantasmas, vuelve al laboratorio subterráneo de Richtofen. Un jugador debe interactuar obligatoriamente con la silla eléctrica del centro de la sala, sacrificándose de forma temporal.</p>`},
              {id:'fase3-final', num:'09', title:'Enfrentamiento Final', videoId:'L3yu30XU6Is', time:1620, embed:true, html:`
                <p>El resto del equipo debe repeler una oleada masiva de Brutus y zombis mientras protege la sala. Al terminar el ritual, el portal central de Alcatraz se abre por completo: crúzalo para acceder a la arena exterior y destruye el mecanismo principal del Alcaide con vuestras armas especiales a máxima potencia para sellar la victoria.</p>`}
            ]
          },

        id:'voyage-of-despair', name:'Voyage of Despair', sub:'Abandonar el Barco', status:'active',
        title:'Voyage of Despair', subtitle:'Abandonar el Barco',
        desc:'Guía de consulta rápida para el RMS Titanic: el Cetro de Ra, el Kraken y su mejora de hielo, y la travesía completa del Easter Egg hasta el Ojo de Odín.',
        theme:{
          accent:'#3f7ea6', accentDim:'#2a5772', gold:'#c2a45c', goldSoft:'#8a763f',
          stone950:'#0a0f14', stone900:'#111a22', stone800:'#182530', stone700:'#223444', stone600:'#33505f', line:'#2c414f'
        },
        tags:{
          agua:{label:'Agua', color:'#4fa3d9'},
          fuego:{label:'Fuego', color:'#d97a3d'},
          electrico:{label:'Eléctrico', color:'#d9c94f'},
          veneno:{label:'Veneno', color:'#6fae5a'}
        },
        tabs:[
          {
            id:'construibles', label:'Construibles',
            items:[
              {id:'escudo-resumen', title:'El Cetro de Ra', html:`
                <p>El <strong>Cetro de Ra</strong> genera una cúpula de protección, imprescindible para sobrevivir a los ataques de muerte instantánea del Ojo gigante en la batalla final.</p>
                <p>Se monta con tres piezas repartidas por el barco; en cada partida solo hay una ubicación posible de cada una:</p>`},
              {id:'pieza-puente', title:'Pieza 1 · Puente / Camarotes', html:`
                <p>En una silla del Puente de Mando, o en los Camarotes de Lujo.</p>`},
              {id:'pieza-provisiones', title:'Pieza 2 · Provisiones / Cocina', html:`
                <p>Sobre unas cajas en Provisiones, o en las mesas de la Cocina (Galley).</p>`},
              {id:'pieza-tercera', title:'Pieza 3 · 3ª Clase / Camarotes Inferiores', html:`
                <p>En las barandillas de madera, o tirada cerca de la Gran Escalera Inferior.</p>`},
              {id:'escudo-construccion', title:'Ensamblaje', html:`
                <p>Ensámblalo en la mesa de la Cubierta de Botes (Boat Deck) o en Provisiones.</p>
                <figure class="shot" data-slot="vod-escudo">
                  <img src="img/vod-escudo.jpg" alt="Mesa de construcción del Cetro de Ra" loading="lazy" onerror="this.closest('.shot').style.display='none'">
                  <figcaption>Mesa de construcción en el RMS Titanic</figcaption>
                </figure>`}
            ]
          },
          {
            id:'easterEgg', label:'Easter Egg',
            items:[
              {id:'loadout', title:'Equipo recomendado', html:`
                <p>Arma obligatoria: <strong>Lanzacohetes Hellion Salvo</strong> mejorado al máximo — con él, el jefe final cae en segundos. Como secundaria, el <strong>Kraken de Hielo</strong> ayuda mucho a controlar oleadas. El Cetro de Ra (pestaña <button class="link-btn" onclick="switchTab('construibles')">Construibles</button>) es imprescindible para sobrevivir a los ataques de muerte instantánea del jefe final.</p>
                <p>En bebidas, prioriza <strong>Deslizarse de Tortuga</strong> (inmunidad a tus propias explosiones si usas el Hellion Salvo de cerca), <strong>Deseo de Morir</strong> (salvavidas contra los Blightfather) y <strong>Banda de la Victoria</strong> para aguantar con el escudo en los pasillos estrechos; añade <strong>Stamin-Up</strong> si hay hueco, el barco es enorme.</p>`},
              {id:'ee-intro', title:'Antes de empezar', html:`
                <p>Activa el <strong>Artefacto Centinela</strong> (la luz azul de la Cubierta de Toldos, al final del barco) y el <strong>Pack-a-Punch</strong>, interactuando con los cuatro pedestales de madera (Cubierta de Toldos, Gran Escalera Inferior, Bodega de Carga y Sala de Turbinas).</p>`},
              {id:'arma-kraken', title:'Prerrequisito · Kraken Gratis', html:`
                <p>Mata a un <strong>Fogonero</strong> (Stoker, el zombi gigante que lanza carbón) disparando a sus puntos débiles brillantes: soltará una llave dorada.</p>
                <p>Busca un cofre de madera cerrado (aparece en Salas de Correo, Sala de Turbinas, Provisiones, Camarotes o Cocina), ábrelo con la llave y mata zombis cerca para llenarlo de almas. El cofre se teletransportará dos veces más: llénalo en sus tres ubicaciones en total.</p>
                <p>Al final soltará un objeto (brújula, telescopio...). Llévalo a las cubiertas exteriores y busca la caja de madera con el mismo símbolo: un tentáculo gigante la aplastará y te dejará el <strong>Kraken gratis</strong>.</p>
                <figure class="shot" data-slot="vod-kraken">
                  <img src="img/vod-kraken.jpg" alt="Tentáculo gigante soltando el Kraken en la cubierta" loading="lazy" onerror="this.closest('.shot').style.display='none'">
                  <figcaption>El tentáculo gigante entregando el Kraken</figcaption>
                </figure>`},
              {id:'arma-kraken-hielo', title:'Mejora · Kraken de Hielo', html:`
                <p>Recoge las tres piezas genéricas del kit de mejora (cámara, cañón y tubo) en la Bodega de Carga, la Sala de Turbinas y los pasillos de 1ª Clase. Mata después a un zombi elemental de hielo (los azules) con el Kraken: soltará un núcleo de hielo concentrado.</p>
                <p>Llévalo a la mesa de crafteo de la Sala de Máquinas para convertirlo en el <strong>Kraken de Hielo</strong>, ideal para congelar pasillos enteros.</p>`},
              {id:'paso1', num:'01', title:'Relojes y Válvulas', html:`
                <p>Por el barco hay 4 símbolos geométricos (triángulos apuntando arriba, abajo o con una línea) que representan los cuatro elementos. Busca junto a qué reloj de pared aparece cada uno y anota la hora que marca (ej.: triángulo de Agua = 11:30).</p>
                <p>Ve al Puente de Mando (2 válvulas) y a la Sala de Máquinas (2 válvulas) y ajusta la hora de cada una para que coincida con la de su elemento. <strong>Atención:</strong> las válvulas de los minutos se mueven en intervalos de 5.</p>
                <figure class="shot" data-slot="vod-reloj">
                  <img src="img/vod-reloj.jpg" alt="Reloj de pared marcando la hora junto a un triángulo elemental" loading="lazy" onerror="this.closest('.shot').style.display='none'">
                  <figcaption>Reloj de pared junto a su símbolo elemental</figcaption>
                </figure>`},
              {id:'paso2', num:'02', title:'Catalizadores Elementales', html:`
                <p>Aparecerán 4 enchufes de colores repartidos por el barco, cada uno soltando un elemento (hielo, fuego, eléctrico, veneno). Lleva a un zombi catalizador de ese mismo elemento junto al enchufe correspondiente y mátalo ahí: se formará un círculo ritual en el suelo.</p>
                <p>Ponte sobre el círculo para teletransportarte a una zona de supervivencia en escala de grises y aguanta la oleada de zombis. Repite el proceso para los cuatro elementos hasta conseguir el artefacto real.</p>
                <figure class="shot" data-slot="vod-catalizador">
                  <img src="img/vod-catalizador.jpg" alt="Zombi catalizador eliminado sobre el enchufe elemental" loading="lazy" onerror="this.closest('.shot').style.display='none'">
                  <figcaption>Zombi catalizador junto al enchufe elemental</figcaption>
                </figure>`},
              {id:'paso3', num:'03', title:'El Sistema Solar', html:`
                <p>Ve a la Bodega de Carga e interactúa con la maqueta del Sistema Solar: los planetas se iluminan en un orden aleatorio. Anota ese orden exacto.</p>
                <p>Sal al exterior, busca en el cielo nocturno el primer planeta de tu lista y dispárale. Caerá como un orbe brillante en un punto concreto del barco; recógelo corriendo y devuélvelo a su posición en la maqueta antes de que se acabe el tiempo. Repite el proceso siguiendo tu orden para todos los planetas.</p>
                <figure class="shot" data-slot="vod-planeta">
                  <img src="img/vod-planeta.jpg" alt="Disparando a un planeta brillante en el cielo del Atlántico" loading="lazy" onerror="this.closest('.shot').style.display='none'">
                  <figcaption>Disparando al planeta real en el cielo nocturno</figcaption>
                </figure>`},
              {id:'paso4', num:'04', title:'El Bloque de Hielo', html:`
                <p>Lleva el Artefacto Real ya cargado a la Sala de Máquinas. Un bloque de hielo gigante bloquea una puerta: dispárale con el Kraken de Hielo (a ser posible mejorado en el Pack-a-Punch) hasta destrozarlo. Esto inunda temporalmente el barco y te lleva a la siguiente fase.</p>`},
              {id:'paso5', num:'05', title:'El Ojo de Odín', html:`
                <p>Interactúa con el timón del Puente de Mando para acceder al combate final, dividido en 5 fases por distintas zonas del barco, contra un jefe con forma de ojo gigante congelado.</p>
                <p>Cuando el Ojo empiece a brillar con fuerza (está cargando su ataque de muerte instantánea), lanza Homúnculos para distraer a los zombis, despliega el Cetro de Ra para protegerte y vacía el lanzacohetes Hellion Salvo directamente sobre la pupila. Su daño es tan alto que anula el ataque y acelera muchísimo el resto de fases.</p>
                <p class="note">Este último tramo está contrastado con guías comunitarias adicionales, ya que tu documento no incluía marcas de tiempo de vídeo para esta parte (ver Fuentes).</p>`}
            ]
          },
          {
            id:'secretos', label:'Secretos',
            items:[
              {id:'secretos-placeholder', title:'Próximamente', html:`

            ]
          }
        ],

            {id:'jetgun', title:'El Jet Gun (Thrustodyne Model 23)', html:`
              <p>Es el arma especial necesaria para el lado de Richtofen. Se monta con 4 piezas:</p>
              <ul>
                <li>En el túnel entre Bus Depot y el Diner, junto a la reja cerca del wallbuy del M16.</li>
                <li>En el garaje del mecánico, dentro del Diner, encima de una taquilla.</li>
                <li>En la Estación de Energía, en la pasarela metálica bajo la máquina de Tombstone.</li>
                <li>En el edificio con forma de Nacht der Untoten, entre Farm y Power Station (se accede cruzando el maizal por la derecha).</li>
              </ul>
              <p>Todas las piezas se llevan y se sueltan en la mesa de crafteo de Town, junto a Stamin-Up.</p>`}
          ]},
          {id:'easterEgg', label:'Easter Egg', items:[
            {id:'ee-intro', title:'Antes de empezar', html:`
              <p>Juega en dificultad <strong>Original</strong> (en Fácil el Easter Egg no funciona). Para oír las pistas de Richtofen, conviene jugar como Samuel J. Stuhlinger, el único que le escucha con la energía encendida.</p>`},
            {id:'paso1', num:'01', title:'Enciende la energía', html:`
              <p>Ve a la Estación de Energía (750 puntos) y activa el interruptor. Deja la energía encendida durante todo este lado del Easter Egg.</p>`},
            {id:'paso2', num:'02', title:'Construye el Jet Gun', html:`
              <p>Consigue las 4 piezas (pestaña <button class="link-btn" onclick="switchTab('construibles')">Construibles</button>) y móntalo en la mesa de Town.</p>`},
            {id:'paso3', num:'03', title:'Calienta el pilón', html:`
              <p>Lleva el Jet Gun bajo el pilón del maizal (frente al edificio tipo Nacht der Untoten, lado izquierdo) y dispara sobre él hasta que Richtofen le diga a Samuel que el primer paso está hecho.</p>`},
            {id:'paso4', num:'04', title:'Sobrecarga con explosivos', html:`
              <p>Sigue matando zombis bajo el pilón, pero solo con armas explosivas (la Ray Gun normal cuenta). Continúa hasta que Richtofen avise de que la energía es demasiado alta.</p>`},
            {id:'paso5', num:'05', title:'Granadas EMP', html:`
              <p>Consigue al menos 2 Granadas EMP en la Caja Misteriosa (lo ideal es que 4 jugadores tengan una cada uno).</p>`},
            {id:'paso6', num:'06', title:'Los 4 postes de luz', html:`
              <p>Localiza los postes de luz verdes repartidos por el mapa (Bus Depot, Diner, Farm, Town...) y lanza una Granada EMP a cuatro de ellos <strong>al mismo tiempo</strong>. Con 4 jugadores es sencillo; con 2, hay que usar un denizen bajo un poste para teletransportarse y repetir la jugada rápido en el siguiente.</p>`},
            {id:'paso7', num:'07', title:'Confirmación', html:`
              <p>Si se hace a tiempo, saldrá un orbe azul del poste hacia el pilón. El pilón brillará azul de forma permanente: el lado de Richtofen está completado.</p>`}
          ]},

          {id:'easterEgg', label:'Easter Egg', items:[
            {id:'ee-intro', title:'Antes de empezar', html:`<p>Juega en dificultad <strong>Original</strong>. Este lado requiere idealmente 4 jugadores, sobre todo para el paso final.</p>`},
            {id:'paso1', num:'01', title:'Enciende y apaga la energía', html:`
              <p>Ve a la Estación de Energía y activa el interruptor. Después, vuelve a apagarlo: con la energía apagada las máquinas de bebidas no funcionan, así que compra tus perks antes de este paso.</p>`},
            {id:'paso2', num:'02', title:'Invoca al Avogadro', html:`
              <p>Con al menos 2 Turbinas colocadas bajo el pilón del maizal, espera a que haya tormenta eléctrica en todo el cielo (no solo en una dirección) y remata al último zombi de la ronda. Esto invoca al Avogadro.</p>`},
            {id:'paso3', num:'03', title:'Elimina al Avogadro', html:`
              <p>Mátalo bajo el pilón; una Granada EMP es la forma más rápida, aunque también puede caer a golpes.</p>`},
            {id:'paso4', num:'04', title:'Turbinas en los postes', html:`
              <p>Dos jugadores mantienen sus Turbinas encendidas bajo el pilón. Los otros dos deben llevar Turbinas a postes de luz en distintos puntos de interés (por ejemplo, Bus Depot y el Diner) y activarlas.</p>`},
            {id:'paso5', num:'05', title:'Activación simultánea', html:`
              <p>Todos los jugadores deben colocar sus Turbinas en sus puestos <strong>al mismo tiempo</strong>. Si se hace bien, el poste emite un orbe naranja hacia el pilón.</p>`},

            {id:'paso2', num:'02', title:'Los 4 símbolos de ascensor', html:`
              <p>Todos los jugadores deben subirse a la vez a los 4 símbolos dorados situados encima de otros tantos ascensores (junto al Bowie Knife, bajo la torre de agua destruida, junto al M14 del lobby y en el sótano del lobby).</p>`},
            {id:'paso3', num:'03', title:'Las bolas de los dragones', html:`

            {id:'paso5', num:'05', title:'Trample Steams', html:`
              <p>Cada jugador coloca un Trample Steam sobre los símbolos dorados con un zombi encima, orientados hacia la torre de radio. Consigue 15 bajas usando estos Trample Steams.</p>`},
            {id:'paso6', num:'06', title:'Las fichas de Mahjong', html:`

            {id:'paso7', num:'07', title:'Golpea la torre', html:`

              <p>Consigue el Cuchillo Balístico en la Caja, mejóralo en el Pack-a-Punch y dispara con él al suelo de la Sala Buda hasta obtener una nueva frase de Maxis.</p>`},
            {id:'paso4', num:'04', title:'Trample Steams y bolas de dragón', html:`

        theme:{accent:'#b3272c', accentDim:'#7a1a1d', gold:'#c9a227', goldSoft:'#8a7124', stone950:'#120e0a', stone900:'#1c150f', stone800:'#281d13', stone700:'#3a2a1a', stone600:'#54401f', line:'#4a3620'},

            {id:'blundergat', title:'Blundergat gratis', html:`
              <p>Alimenta a los tres Cerberos (cabezas de perro en la pared) matando zombis cerca de sus emblemas. Al llenarse los tres, aparece el Hell's Retriever cerca de la Cripta. Con él, lanza el hacha a los 5 cráneos azules repartidos por el mapa para conseguir el Blundergat gratis.</p>`},
            {id:'spoon', title:'La Cuchara (Golden Spork)', html:`
              <p>Basta con la Cuchara básica (no hace falta subirla a Golden Spork) para completar el Easter Egg principal.</p>`}
          ]},
          {id:'easterEgg', label:'Easter Egg', items:[
            {id:'ee-intro', title:'Antes de empezar', html:`<p>Se necesitan mínimo 2 jugadores; uno de ellos jugará el papel de Weasel. No se puede completar en solitario.</p>`},
            {id:'paso1', num:'01', title:'Prerrequisitos', html:`
              <p>Consigue el Blundergat gratis y la Cuchara (pestaña <button class="link-btn" onclick="switchTab('construibles')">Construibles</button>).</p>`},
            {id:'paso2', num:'02', title:'Los números de los presos', html:`
              <p>En el teclado numérico de los Túneles de la Ciudadela, introduce los cuatro números de los presos: <strong>101, 386, 872 y 481</strong> (uno por ronda, si es posible).</p>`},
            {id:'paso3', num:'03', title:'Los auriculares', html:`
              <p>Tras introducir los números, irán apareciendo power-ups con forma de auriculares por distintos puntos del mapa (escalera a la Ciudadela, junto a Double Tap, pasarela entre la Oficina del Alcaide y la cafetería, escalera a la enfermería y escalera al tejado). Recógelos y escúchalos enteros; no aparece el siguiente hasta terminar el actual.</p>`},
            {id:'paso4', num:'04', title:'Sube al avión', html:`
              <p>Con todas las narraciones escuchadas, sube al avión Ícaro en el modo Más Allá (Afterlife). El resto del equipo será arrastrado automáticamente a la misma zona; todos deben revivirse.</p>`},
            {id:'paso5', num:'05', title:'El desenlace', html:`

        desc:'Easter Egg único del mapa (sin lados de Richtofen/Maxis). Se puede completar en solitario, aunque es más llevadero con 2-4 jugadores.',
        theme:{accent:'#6f7a4f', accentDim:'#4d5636', gold:'#c9a227', goldSoft:'#8a7124', stone950:'#0f0e0a', stone900:'#181510', stone800:'#221d16', stone700:'#332a1c', stone600:'#4a3d28', line:'#3d331f'},
        tabs:[
          {id:'construibles', label:'Construibles', items:[
            {id:'staffs', title:'Los 4 Bastones Elementales', html:`
    <p class="note">Manual de construcción y puzles de mejora del Grupo 935.</p>

    <h2>📻 PREPARATIVOS: Gramófono y Disco Negro</h2>
    <div class="meta-box">
        <p>Antes de poder construir cualquier bastón, necesitas acceder a la cámara inferior de la Excavación. Necesitas dos objetos:</p>
        <ul>
            <li><strong>El Gramófono:</strong> Siempre está en el Sitio de Excavación (en el suelo junto a la mesa, sobre escombros o maquinaria).</li>
            <li><strong>El Disco Negro:</strong> Aparece en el Sitio de Excavación (carretilla al lado del Pack-a-Punch, cerca del motor detrás de la excavación, o en el camino hacia la iglesia).</li>
        </ul>
        <p>Coloca el Gramófono en la mesa de la Excavación para abrir las escaleras ocultas hacia la sala de los pedestales.</p>
    </div>
    
        <div class="img-frame" style="flex: 0 0 300px; margin: 0;"><img src="../images/bo2/origins/gramofono.jpg" alt="Piezas del gramófono" style="max-width: 40%; height: auto; border-radius: 4px;"></div>

    <h2>❄️ BASTÓN DE HIELO (Ull's Arrow)</h2>
    <h3>1. Construcción</h3>
    <ul>
        <li><strong>Disco Azul:</strong> En la Estación de Tanques del Generador 2 (estanterías cerca de la caja misteriosa o sobre la mesa).</li>
        <div class="img-frame" style="flex: 0 0 300px; margin: 0;"><img src="../images/bo2/origins/discos_hielo.jpg" alt="Disco del bastón de hielo" style="max-width: 40%; height: auto; border-radius: 4px;"></div>
        <li><strong>Piezas (3):</strong> Se consiguen <strong>EXCAVANDO</strong> montículos de tierra/huesos con una pala, <strong>ÚNICAMENTE cuando está nevando</strong>.</li>
        <div class="img-frame" style="flex: 0 0 300px; margin: 0;"><img src="../images/bo2/origins/pieza_hielo.jpg" alt="Piezas del bastón de hielo" style="max-width: 40%; height: auto; border-radius: 4px;"></div>
        <li><strong>Gema:</strong> Entra por el Túnel de Hielo (cerca del Generador 6 / Iglesia) usando el gramófono.</li>
    </ul>

    <h3>2. Mejora (Puzle del Crazy Place)</h3>
    <p>Mira al techo azul. Verás un símbolo de puntos y círculos. Debes disparar con el bastón al panel de piedra de la pared que corresponda a la traducción de ese símbolo.</p>
    <div class="img-frame" style="flex: 0 0 300px; margin: 0;"><img src="../images/bo2/origins/mejora_baston_hielo_cp.png" alt="Chuleta del bastón de hielo" style="max-width: 100%; height: auto; border-radius: 4px;"></div>


    <h3>3. Mejora (Paso Superficie)</h3>
    <p>Congela 3 lápidas de agua disparándoles con el Bastón de Hielo y luego destrúyelas disparándoles con un arma de balas normal:</p>
    <ol>
        <li>Justo al lado del Generador 4 (Juggernog).</li>
        <li>Entre el Sitio de Excavación y el Generador 4, en el barro donde pasa el robot.</li>
        <li>Detrás del búnker del Generador 2 (cerca del inicio del tanque).</li>
    </ol>

    <h2>🌪️ BASTÓN DE VIENTO (Boreas' Fury)</h2>
    <h3>1. Construcción</h3>
    <ul>
        <li><strong>Disco Amarillo:</strong> Zona del Generador 5 (cerca de Stamin-Up, en el túnel de viento o sobre cajas).</li>
        <div class="img-frame" style="flex: 0 0 300px; margin: 0;"><img src="../images/bo2/origins/discos_viento.jpg" alt="Disco del Bastón de Viento" style="max-width: 40%; height: auto; border-radius: 4px;"></div>
        <li><strong>Piezas (3):</strong> Debes entrar en la cabeza de los 3 Robots Gigantes (Odín, Thor, Freya). Dispárale al pie que tiene círculos iluminados cuando vaya a pisarte.</li>
        <div class="img-frame" style="flex: 0 0 300px; margin: 0;"><img src="../images/bo2/origins/piezas_viento.jpg" alt="Piezas del Bastón de Viento" style="max-width: 60%; height: auto; border-radius: 4px;"></div>
        <li><strong>Gema:</strong> Entra por el Túnel de Viento (cerca del Generador 4 / Juggernog).</li>
    </ul>

    <h3>2. Mejora (Puzle del Crazy Place)</h3>
    <p>Verás 4 anillos concéntricos en el techo. Dispara a los anillos con el bastón para girarlos y alinearlos hacia el centro de la sala. El orden correcto de los símbolos (leyendo del anillo más interior al más exterior) es:</p>
    <div class="cheat-sheet">
        <strong>ALINEACIÓN DE ANILLOS DE VIENTO:</strong><br>
        • Anillo 1 (Centro): <strong>I</strong><br>
        • Anillo 2: <strong>I L</strong><br>
        • Anillo 3: <strong>I I L</strong><br>
        • Anillo 4 (Exterior): <strong>L</strong>
    </div>
    <div class="img-frame" style="flex: 0 0 300px; margin: 0;"><img src="../images/bo2/origins/mejora_viento.jpg" alt="Chuleta del bastón de viento" style="max-width: 40%; height: auto; border-radius: 4px;"></div>
    

    <h3>3. Mejora (Paso Superficie)</h3>
    <p>Dispara a 3 esferas de piedra humeantes con el bastón para redirigir el humo hacia la excavación central:</p>
    <ol>
        <li>Junto al Generador 4 (mirando hacia la excavación).</li>
        <li>En el camino de barro entre la Iglesia y el generador 5.</li>
        <li>Detrás del Generador 5 (Stamin-Up), mirando hacia la excavación.</li>
    </ol>

    <h2>⚡ BASTÓN DE RAYO (Kimat's Bite)</h2>
    <h3>1. Construcción</h3>
    <ul>
        <li><strong>Disco Morado:</strong> Zona del Generador 4 (sobre el carro junto a Juggernog, en la mesa del túnel de viento o cerca).</li>
        <div class="img-frame" style="flex: 0 0 300px; margin: 0;"><img src="../images/bo2/origins/discos_rayo.jpg" alt="Disco del Bastón de Rayo" style="max-width: 20%; height: auto; border-radius: 4px;"></div>
        <li><strong>Piezas (3):</strong> Viaja en el Tanque (500 pts). Durante el trayecto, debes saltar del tanque a 3 plataformas de madera inalcanzables a pie.</li>
        <div class="img-frame" style="flex: 0 0 300px; margin: 0;"><img src="../images/bo2/origins/piezas_rayo.jpg" alt="Piezas del Bastón de Rayo" style="max-width: 20%; height: auto; border-radius: 4px;"></div>

        <li><strong>Gema:</strong> Entra por el Túnel de Rayo (cerca del Generador 5 / Stamin-Up).</li>
    </ul>
    

    <h3>2. Mejora (Puzle del Crazy Place)</h3>
    <p>Verás triángulos morados en la pared como un teclado de piano. Solo dispara a las notas de la <strong>fila inferior</strong>. Leyendo la fila inferior de izquierda a derecha (notas 1 a 7), toca estos acordes en orden:</p>
    <div class="cheat-sheet">
        <strong>ACORDES DE RAYO (Fila Inferior):</strong><br>
        • Primer acorde: <strong>1 - 3 - 6</strong><br>
        • Segundo acorde: <strong>3 - 5 - 7</strong><br>
        • Tercer acorde: <strong>2 - 4 - 6</strong>
    </div>


    <h3>3. Mejora (Paso Superficie)</h3>
    <p>Gira los diales de 7 paneles eléctricos que echan chispas por el mapa hasta que dejen de soltar chispas (Gen 5, Gen 4, Iglesia abajo, Iglesia arriba, Spawn, Gen 2 y detrás de Excavación).</p>
    <div class="guide-split">
    <table style="flex: 1; border-collapse: collapse;">
    <tr>
        <th style="background-color: #171d25; color: #66c0f4; border: 1px solid #2a475e; padding: 8px; text-align: left;">Ubicación del Panel</th>
        <th style="background-color: #171d25; color: #66c0f4; border: 1px solid #2a475e; padding: 8px; text-align: center;">Posición</th>
    </tr>
    <tr><td style="border: 1px solid #2a475e; padding: 8px;">Generador 5 (Frente a Stamin-Up)</td><td style="border: 1px solid #2a475e; padding: 8px; text-align: center;">⬆️ Arriba</td></tr>
    <tr><td style="border: 1px solid #2a475e; padding: 8px;">Iglesia (Planta baja detrás del tanque)</td><td style="border: 1px solid #2a475e; padding: 8px; text-align: center;">➡️ Derecha</td></tr>
    <tr><td style="border: 1px solid #2a475e; padding: 8px;">Iglesia (Planta alta junto a la ventana)</td><td style="border: 1px solid #2a475e; padding: 8px; text-align: center;">⬇️ Abajo</td></tr>
    <tr><td style="border: 1px solid #2a475e; padding: 8px;">Derecha de la entrada al Túnel de Viento (Amarillo)</td><td style="border: 1px solid #2a475e; padding: 8px; text-align: center;">⬇️ Abajo</td></tr>
    <tr><td style="border: 1px solid #2a475e; padding: 8px;">Spawn Original en las escaleras (Generador 1)</td><td style="border: 1px solid #2a475e; padding: 8px; text-align: center;">➡️ Derecha</td></tr>
    <tr><td style="border: 1px solid #2a475e; padding: 8px;">Estación del Tanque (Generador 2) en la puerta trasera</td><td style="border: 1px solid #2a475e; padding: 8px; text-align: center;">⬆️ Arriba</td></tr>
    <tr><td style="border: 1px solid #2a475e; padding: 8px;">Detrás de Excavación cerca de escaleras a la Iglesia</td><td style="border: 1px solid #2a475e; padding: 8px; text-align: center;">⬇️ Abajo</td></tr>
</table>
    <div class="img-frame" style="flex: 0 0 300px; margin: 0;"><img src="../images/bo2/origins/ejemplo_panel_mejora_rayo.jpg" alt="Ejemplo de panel de mejora de rayo" style="max-width: 100%; height: auto; border-radius: 4px;"></div>
    </div>

    <h2>🔥 BASTÓN DE FUEGO (Kagutsuchi's Blood)</h2>
    <h3>1. Construcción</h3>
    <ul>
        <li><strong>Disco Rojo:</strong> Iglesia (bancos de arriba, cajas de arriba o cerca del Generador 6).</li>
        <div class="img-frame" style="flex: 0 0 300px; margin: 0;"><img src="../images/bo2/origins/discos_fuego.jpg" alt="Discos del bastón de fuego" style="max-width: 30%; height: auto; border-radius: 4px;"></div>
        <li><strong>Piezas (3):</strong> Activar Gen 6, derribar el avión rojo brillante en el cielo, y matar al primer Panzersoldat en la Ronda 8.</li>
        <div class="img-frame" style="flex: 0 0 300px; margin: 0;"><img src="../images/bo2/origins/piezas_fuego.jpg" alt="Piezas del bastón de fuego" style="max-width: 60%; height: auto; border-radius: 4px;"></div>
        <li><strong>Gema:</strong> Entra por el Túnel de Fuego (cerca del Generador 3  = Presitidigitación).</li>
    </ul>

    
    <h3>2. Mejora (Puzle del Crazy Place)</h3>
    <p>Mata zombis usando el Bastón de Fuego mientras están pisando las rejillas metálicas de la zona roja para encender los 4 calderos de piedra gigantes.</p>

    <h3>3. Mejora (Paso Superficie)</h3>
    <p>En la planta alta de la Iglesia, traduce los símbolos de sangre iluminados a números y dispara a las antorchas de la planta baja en ese orden (el 4 siempre es la antorcha con sangre).</p>
    <table>
        <tr><th>Símbolo de Sangre</th><th>Número</th></tr>
        <tr><td>Tres círculos pequeños</td><td>3</td></tr>
        <tr><td>Antorcha con sangre</td><td>4</td></tr>
        <tr><td>Un círculo grande + un cuarto</td><td>5</td></tr>
        <tr><td>Un círculo grande + medio</td><td>6</td></tr>
        <tr><td>Un círculo grande + tres cuartos</td><td>7</td></tr>
        <tr><td>Dos círculos grandes</td><td>8</td></tr>
        <tr><td>Dos círculos grandes + un cuarto</td><td>9</td></tr>
        <tr><td>Dos círculos grandes + tres cuartos</td><td>11</td></tr>
    </table>
    <div class="img-frame" style="flex: 0 0 300px; margin: 0;"><img src="../images/bo2/origins/mejora_baston_fuego.jpg" alt="Ejemplo de panel de mejora de rayo" style="max-width: 100%; height: auto; border-radius: 4px;"></div>
    
    <h2>🔮 PASO FINAL PARA LOS 4 BASTONES</h2>
    <p>En la cámara inferior de la Excavación, mueve las 4 palancas para alinear los 4 anillos gigantes al color de tu bastón. Dispara al orbe brillante en la parte inferior para enviarlo al techo.</p>
    <p>Baja al <em>Crazy Place</em>, inserta tu bastón en su pedestal y mata a unos 20 zombis cerca para llenarlo de almas.</p>
`},
            {id:'drone', title:'El Dron de Maxis', html:`<p>Se construye con 3 piezas (cerebro, chasis y hélices) y ayuda a matar zombis, revivir y recoger power-ups; además es imprescindible para el Easter Egg.</p>`}
          ]},
          {id:'easterEgg', label:'Easter Egg', items:[
            {id:'ee-intro', title:'Antes de empezar', html:`<p>No se puede completar en dificultad Fácil. Se recomienda construir los 4 Bastones y el Dron de Maxis antes de empezar los pasos finales.</p>`},
            {id:'paso1', num:'01', title:'Enciende los 6 generadores', html:`

// ---------------- estado ----------------
let currentGame = GAMES.find(g=>g.status==='active');
let currentMapObj = currentGame.maps.find(m=>m.status==='active');
let currentTab = currentMapObj.tabs[1] ? currentMapObj.tabs[1].id : currentMapObj.tabs[0].id;

function applyTheme(map){
  const t = map.theme || {};
  const root = document.documentElement.style;
  const set = (k,v) => { if(v) root.setProperty(k, v); };
  set('--ember', t.accent);
  set('--ember-dim', t.accentDim);
  set('--gold', t.gold);
  set('--gold-soft', t.goldSoft);
  set('--stone-950', t.stone950);
  set('--stone-900', t.stone900);
  set('--stone-800', t.stone800);
  set('--stone-700', t.stone700);
  set('--stone-600', t.stone600);
  set('--line', t.line);
}

function selectMap(gameId, mapId){
  const game = GAMES.find(g=>g.id===gameId);
  if(!game) return;
  const map = game.maps.find(m=>m.id===mapId && m.status==='active');
  if(!map) return;
  currentGame = game;
  currentMapObj = map;
  currentTab = map.tabs[1] ? map.tabs[1].id : map.tabs[0].id;
  applyTheme(map);
  renderSidebar();
  renderHero();
  renderTabs();
  renderPanels();
  renderSources();
  renderQuickIndex();
  closeSidebar();
}

function renderSidebar(){
  const tree = document.getElementById('gameTree');
  tree.innerHTML = GAMES.map(game=>{
    if(game.status!=='active'){
      return `<div class="game-block soon"><span class="game-name">${game.name} <span class="pill-soon">Pronto</span></span></div>`;
    }
    const maps = game.maps.map(m=>{
      if(m.status!=='active'){
        return `<li class="map-item soon">${m.name} <span class="pill-soon">Pronto</span></li>`;
      }
      return `<li class="map-item ${m.id===currentMapObj.id?'active':''}" data-game="${game.id}" data-map="${m.id}">
                <span>${m.name}<span class="sub">${m.sub||''}</span></span>
              </li>`;
    }).join('');
    return `<div class="game-block">
              <span class="game-name">${game.name}</span>
              <ul class="map-list">${maps}</ul>
            </div>`;
  }).join('');
  tree.querySelectorAll('.map-item[data-map]').forEach(li=>{
    li.addEventListener('click', ()=>selectMap(li.dataset.game, li.dataset.map));
  });
}

function renderHero(){
  const map = currentMapObj;
  document.getElementById('breadcrumb').textContent = currentGame.name + ' / ' + map.name;
  document.getElementById('mapTitle').textContent = map.title;
  document.getElementById('mapSubtitle').textContent = map.subtitle;
  document.getElementById('mapDesc').textContent = map.desc;
  const tags = map.tags || {};
  document.getElementById('godLegend').innerHTML = Object.values(tags).map(t=>
    `<span class="god-chip"><span class="god-dot" style="background:${t.color}"></span>${t.label}</span>`
  ).join('');
}

function renderTabs(){
  const bar = document.getElementById('tabBar');
  bar.innerHTML = currentMapObj.tabs.map(t=>
    `<button class="tab-btn ${t.id===currentTab?'active':''}" data-tab="${t.id}">${t.label}</button>`
  ).join('');
  bar.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>switchTab(btn.dataset.tab));
  });
}

function cardHTML(item){
  const tags = currentMapObj.tags || {};
  const tagInfo = item.tag ? tags[item.tag] : null;
  const tag = tagInfo ? `<span class="tag" style="color:${tagInfo.color};border-color:${tagInfo.color}">${tagInfo.label}</span>` : '';
  const num = item.num ? `<span class="step-num">${item.num}</span>` : '';
  const vid = item.videoId || currentMapObj.videoId || DEFAULT_YT_ID;
  let media = '';
  if(item.embed && item.time!=null){
    media = `<div class="clip"><iframe src="https://www.youtube.com/embed/${vid}?start=${item.time}" title="Clip: ${item.title}" loading="lazy" allow="accelerometer; encrypted-media" allowfullscreen></iframe></div>
             <a class="ts-link" href="https://www.youtube.com/watch?v=${vid}&t=${item.time}s" target="_blank" rel="noopener">Abrir en YouTube ↗</a>`;
  } else if(item.embed){
    media = `<div class="clip"><iframe src="https://www.youtube.com/embed/${vid}" title="Clip: ${item.title}" loading="lazy" allow="accelerometer; encrypted-media" allowfullscreen></iframe></div>
             <a class="ts-link" href="https://www.youtube.com/watch?v=${vid}" target="_blank" rel="noopener">Abrir en YouTube ↗</a>`;
  } else if(item.time!=null){
    media = `<a class="ts-link" href="https://www.youtube.com/watch?v=${vid}&t=${item.time}s" target="_blank" rel="noopener">▶ ${fmtTime(item.time)} en el vídeo</a>`;
  } else if(item.videoId){
    media = `<a class="ts-link" href="https://www.youtube.com/watch?v=${item.videoId}" target="_blank" rel="noopener">▶ Ver vídeo de este paso ↗</a>`;
  }
  return `<article class="step-card" id="${item.id}">
            <header class="step-head">${num}<h3>${item.title}</h3>${tag}</header>
            <div class="step-body">${item.html}</div>
            ${media}
          </article>`;
}

function renderPanels(){
  const wrap = document.getElementById('tabPanels');
  wrap.innerHTML = currentMapObj.tabs.map(t=>
    `<section class="tab-panel ${t.id===currentTab?'active':''}" data-tab="${t.id}">
       <div class="cards">${t.items.map(cardHTML).join('')}</div>
     </section>`
  ).join('');
}

function renderSources(){
  document.getElementById('sourcesFooter').innerHTML = currentMapObj.sources
    ? `<h3>Fuentes</h3>${currentMapObj.sources.html}`
    : '';
}

function renderQuickIndex(){
  const tab = currentMapObj.tabs.find(t=>t.id===currentTab);
  document.getElementById('qiTitle').textContent = 'Índice · ' + tab.label;
  document.getElementById('qiList').innerHTML = tab.items.map(it=>
    `<li data-target="${it.id}"><a href="#${it.id}">${it.num? it.num+' · ':''}${it.title}</a></li>`
  ).join('');
  document.querySelectorAll('#qiList a').forEach(a=>{
    a.addEventListener('click', e=>{
      e.preventDefault();
      const target = document.getElementById(a.parentElement.dataset.target);
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
      closeIndexOnMobile();
    });
  });
  setupScrollSpy();
}

let observer;
function setupScrollSpy(){
  if(observer) observer.disconnect();
  const panel = document.querySelector(`.tab-panel[data-tab="${currentTab}"]`);
  if(!panel) return;
  const items = document.querySelectorAll('#qiList li');
  observer = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      const li = document.querySelector(`#qiList li[data-target="${entry.target.id}"]`);
      if(!li) return;
      if(entry.isIntersecting) items.forEach(i=>i.classList.remove('active')), li.classList.add('active');
    });
  }, {rootMargin:'-15% 0px -70% 0px', threshold:0});
  panel.querySelectorAll('.step-card').forEach(card=>observer.observe(card));
}

function switchTab(tabId){
  currentTab = tabId;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tabId));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active', p.dataset.tab===tabId));
  renderQuickIndex();
  document.querySelector('.main').scrollIntoView({behavior:'smooth', block:'start'});
}

// ---------------- mobile drawers ----------------
const sidebarEl = document.getElementById('sidebar');
const quickIndexEl = document.getElementById('quickIndex');
const scrimEl = document.getElementById('scrim');

function openSidebar(){ sidebarEl.classList.add('open'); scrimEl.classList.add('show'); }
function closeSidebar(){ sidebarEl.classList.remove('open'); scrimEl.classList.remove('show'); }
function openIndex(){ quickIndexEl.classList.add('open'); scrimEl.classList.add('show'); }
function closeIndexPanel(){ quickIndexEl.classList.remove('open'); scrimEl.classList.remove('show'); }
function closeIndexOnMobile(){ if(window.innerWidth<=1180) closeIndexPanel(); }

document.getElementById('navToggle').addEventListener('click', ()=>{
  sidebarEl.classList.contains('open') ? closeSidebar() : openSidebar();
});
document.getElementById('indexToggle').addEventListener('click', ()=>{
  quickIndexEl.classList.contains('open') ? closeIndexPanel() : openIndex();
});
scrimEl.addEventListener('click', ()=>{ closeSidebar(); closeIndexPanel(); });

// ---------------- init ----------------
applyTheme(currentMapObj);
renderSidebar();
renderHero();
renderTabs();
renderPanels();
renderSources();
renderQuickIndex();
</script>
